          python3 - "$RUNNER_TEMP/afplay_tv_patch.b64" "$RUNNER_TEMP/afplay_tv_patch.py" <<'PYDECODE'
          import base64
          import pathlib
          import sys
          source = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          clean = ''.join(source.split())
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(clean, validate=True))
          PYDECODE
          python3 - "$RUNNER_TEMP/afplay_tv_patch.py" "$PLAYLIST_URL" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          url = sys.argv[2]
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://acasatv.co/zxy.json', url)
          p.write_text(s, encoding='utf-8')
          PY
          python3 "$RUNNER_TEMP/afplay_tv_patch.py"

      - name: Verify AF Play TV patch
        shell: bash
        run: |
          grep -F 'applicationId = "app.afplay.tv"' app/build.gradle.kts
          grep -F 'data object LiveTv : Screen("live_tv")' app/src/main/java/com/nuvio/tv/ui/navigation/Screen.kt
          grep -F 'Import JSON/M3U' app/src/main/java/com/nuvio/tv/ui/screens/livetv/LiveTvScreen.kt
          grep -F 'torrentio.strem.fun' app/src/main/java/com/nuvio/tv/afplay/AfPlayBootstrap.kt
          grep -F 'opensubtitles-v3.strem.io/manifest.json' app/src/main/java/com/nuvio/tv/data/local/AddonPreferences.kt
          grep -F 'cynex.acasatv.co/manifest.json' app/src/main/java/com/nuvio/tv/afplay/AfPlayBootstrap.kt
          grep -F 'niakw/Niakvio/refs/heads/main/manifest.json' app/src/main/java/com/nuvio/tv/afplay/AfPlayBootstrap.kt
          grep -F 'val hasSeenAuthQrOnFirstLaunch: Boolean? = true' app/src/main/java/com/nuvio/tv/MainActivity.kt
          grep -F 'text = "PLAY TV"' app/src/main/java/com/nuvio/tv/ui/components/BrandWordmark.kt
          grep -F 'TV_CARD_WIDTH = 126.dp' app/src/main/java/com/nuvio/tv/ui/screens/livetv/LiveTvScreen.kt
          grep -F 'cynex.acasatv.co' app/src/main/java/com/nuvio/tv/afplay/AfPlayBootstrap.kt
          grep -F 'niakw/Niakvio' app/src/main/java/com/nuvio/tv/afplay/AfPlayBootstrap.kt
          grep -F "$PLAYLIST_URL" app/src/main/java/com/nuvio/tv/ui/screens/livetv/LiveTvScreen.kt

      - name: Build full debug ARM APKs
        env:
          CI_USE_DEBUG_SIGNING: 'false'
        run: ./gradlew :app:assembleFullDebug --stacktrace --no-daemon --console=plain

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          ARM64="$(find app/build/outputs/apk/full/debug -maxdepth 1 -type f -name '*arm64-v8a*debug*.apk' | head -n 1)"
          ARM32="$(find app/build/outputs/apk/full/debug -maxdepth 1 -type f -name '*armeabi-v7a*debug*.apk' | head -n 1)"
          test -n "$ARM64"
          test -n "$ARM32"
          cp "$ARM64" out/AF-Play-TV-arm64-v8a.apk
          cp "$ARM32" out/AF-Play-TV-armeabi-v7a.apk
          ls -lh out/*.apk

      - name: Upload AF Play TV APKs
        uses: actions/upload-artifact@v7
        with:
          name: AF-Play-TV-AndroidTV-FireTV
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
