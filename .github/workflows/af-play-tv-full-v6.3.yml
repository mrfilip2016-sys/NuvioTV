name: AF Play TV - Smart TV Categories v6.3

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: "URL JSON/M3U TV implicit"
        required: false
        default: "https://acasatv.co/zxy.json"
  push:
    branches: [dev]
    paths:
      - '.github/workflows/af-play-tv-full-v6.3.yml'

permissions:
  contents: read

concurrency:
  group: af-play-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AF Play TV ARM APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PLAYLIST_URL: ${{ github.event.inputs.playlist_url || 'https://acasatv.co/zxy.json' }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - name: Checkout NuvioTV
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 1

      - name: Validate NuvioTV checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/nuvio/tv/MainActivity.kt
          test -f app/src/main/java/com/nuvio/tv/NuvioApplication.kt
          chmod +x gradlew
          echo "NuvioTV dev checkout OK"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare local properties
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob
          SIMKL_APP_NAME=afplay
          USE_LOCAL_FFMPEG_DECODER=false
          DOVI_NATIVE_ENABLED=false
          DOVI_EXTRACTOR_HOOK_READY=false
          DOVI_ENABLE_REAL_LINK=false
          SUPPORTERS_API_BASE_URL=https://nuvio.tv/
          SUPPORT_URL=https://nuvio.tv/support
          EOF
          printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" >> local.properties
          touch local.dev.properties

      - name: Prepare CI signing
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/afplay-tv.jks" \
            -storepass android \
            -alias afplaytv \
            -keypass android \
            -dname "CN=AF Play TV,O=AF Studio,C=IT" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/afplay-tv.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=afplaytv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Apply AF Play TV patch
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/afplay_tv_patch.b64" <<'AFPLAY_PATCH'
          ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCmltcG9ydCByZQoKUk9PVCA9IFBhdGgoJy4nKQoKZGVm
